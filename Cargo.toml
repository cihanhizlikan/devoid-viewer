[package]
name = "devoid_viewer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DevoidViewer"
path = "src/main.rs"

[dependencies]
# ── Windowing & display ───────────────────────────────────────
winit      = { version = "0.29", features = ["rwh_05"] }
softbuffer = { version = "0.4", default-features = false }

# ── Image decoding ────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = [
    "bmp", "png", "jpeg", "gif", "webp", "tiff", "ico",
] }

# JPEG XL
jxl-oxide = { version = "0.10" }

# ── Filesystem watching ───────────────────────────────────────
notify-debouncer-mini = { version = "0.4", default-features = false }

# ── Threading ─────────────────────────────────────────────────
crossbeam-channel = "0.5"

# ── Recycle Bin ───────────────────────────────────────────────
# Safe wrapper over the shell's IFileOperation (FOF_ALLOWUNDO), so
# Delete is undoable without hand-written COM. Default features off:
# `chrono` only serves the freedesktop backend.
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }

# ── Windows API ───────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
] }

[dev-dependencies]
# Per-test scratch directories that delete themselves; std has no way
# to create a unique temporary directory.
tempfile = "3"

# ── Lints ─────────────────────────────────────────────────────
# The bans in clippy.toml are architecture rules, not style, so a
# violation stops the build instead of joining a warning count.
# See docs/settled-decisions.md.
[lints.clippy]
disallowed_methods = "deny"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
