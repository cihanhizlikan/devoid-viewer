[build-dependencies]
winres = "0.1"

[package]
name = "devoid_viewer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "devoid_viewer"
path = "src/main.rs"

[dependencies]
# ── GUI ──────────────────────────────────────────────────────
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.27"

# ── Image decoding ───────────────────────────────────────────
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "png",
    "jpeg",
    "gif",
    "webp",
    "tiff",
    "ico",
] }

# JPEG XL
jxl-oxide = { version = "0.10", features = ["image"] }

# SVG
resvg     = "0.42"
usvg      = "0.42"
tiny-skia = "0.11"

# ── Threading ────────────────────────────────────────────────
crossbeam-channel = "0.5"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
