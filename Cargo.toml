[package]
name = "devoid_viewer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DevoidViewer"
path = "src/main.rs"

[dependencies]
# ── Windowing & display ───────────────────────────────────────
winit      = { version = "0.29", features = ["rwh_05"] }
softbuffer = { version = "0.4", default-features = false }

# ── Image decoding ────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = [
    "bmp", "png", "jpeg", "gif", "webp", "tiff", "ico",
] }

# JPEG XL
jxl-oxide = { version = "0.10" }

# SVG
resvg     = "0.42"
usvg      = "0.42"
tiny-skia = "0.11"

# ── Threading ─────────────────────────────────────────────────
crossbeam-channel = "0.5"

# ── Windows API (delete dialog) ───────────────────────────────
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 1
