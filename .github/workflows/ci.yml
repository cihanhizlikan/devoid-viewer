# The /verify recipe, run by GitHub on every push to main and every pull
# request, so a change is checked whether or not a session remembered to.
# Windows only: the product is Windows-native, and windows-latest ships the
# MSVC linker and Windows SDK the build needs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New RustSec advisories land without any change here; the weekly run
  # catches them. Only the dependency job runs on the schedule.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless in a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml and installs the pinned version
      # with clippy and rustfmt; no third-party toolchain action needed.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # --locked: fail if Cargo.lock is out of date rather than quietly
      # resolving different versions than the ones committed.
      - name: Build
        run: cargo build --all-targets --locked

      # -D warnings makes the measured zero a gate. disallowed_methods is
      # already deny in Cargo.toml.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Report only until the rustfmt open decision in
      # docs/settled-decisions.md is taken. The explicit `exit 0` matters:
      # GitHub's pwsh wrapper ends every script with `exit $LASTEXITCODE`,
      # so fmt's own exit 1 would otherwise fail the step.
      - name: Formatter (report only)
        shell: pwsh
        run: |
          $diffs = (cargo fmt --check 2>&1 | Select-String '^Diff in').Count
          if ($diffs -gt 0) { "::warning::cargo fmt --check reports $diffs diffs (not gated)" }
          else { "cargo fmt --check: clean" }
          exit 0

  # Advisories, licences, duplicate crates and sources (deny.toml). Reads
  # Cargo.lock and crate metadata only, so it runs on Linux with the graph
  # restricted to the Windows target. The released binary is pinned by
  # version and SHA-256 rather than pulled through the Docker action,
  # which rebuilds its image on every run.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  deny.tar.gz" | sha256sum -c -
          tar -xzf deny.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "$name/cargo-deny"
          rm deny.tar.gz

      - name: cargo deny check
        run: cargo deny --locked check
